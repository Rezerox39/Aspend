name: Flutter Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # pubspec.lock declares flutter >=3.44.0; the previous 3.32.4 pin could
      # not resolve the current dependency set.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The committed generated localizations go stale whenever an .arb
      # changes. Regenerating here guarantees the APK ships the same strings
      # the tests ran against.
      - name: Generate localizations
        run: flutter gen-l10n

      # Housekeeping only: keeps the committed generated files in step with
      # the .arb sources. Concurrent runs can race on the push, so this is
      # explicitly non-fatal — it must never block the APK.
      - name: Commit regenerated localizations
        continue-on-error: true
        run: |
          if ! git diff --quiet -- lib/l10n/generated; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/l10n/generated
            git commit -m "chore: regenerate localizations"
            git pull --rebase --autostash origin master
            git push origin HEAD:master
          fi

      - name: Restore Android Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/release.keystore
          echo "Keystore restored successfully"

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../app/release.keystore
          EOF
          echo "key.properties created"

      # Universal APK, matching the shape of the 5.13.4 release the project
      # has been shipping, rather than the per-ABI split set.
      - name: Build release APK
        run: flutter build apk --release

      - name: Show output
        run: |
          ls -la build/app/outputs/flutter-apk/
          du -h build/app/outputs/flutter-apk/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspends-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90

      - name: Upload APK to workflow
        uses: actions/upload-artifact@v4
        with:
          name: apk-only
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
